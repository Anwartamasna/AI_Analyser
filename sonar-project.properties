# SonarQube Configuration for AI Resume Analyzer
# Root project configuration for multi-module analysis

sonar.projectKey=ai-resume-analyzer
sonar.projectName=AI Resume Analyzer
sonar.projectVersion=1.0

# Source encoding
sonar.sourceEncoding=UTF-8

# Modules
sonar.modules=backend,nlp-service

# Backend module (Java/Spring Boot)
backend.sonar.projectName=Resume Analyzer Backend
backend.sonar.projectBaseDir=resumeanalyzer
backend.sonar.sources=src/main/java
backend.sonar.tests=src/test/java
backend.sonar.java.binaries=target/classes
backend.sonar.java.libraries=target/dependency/*.jar
backend.sonar.java.test.binaries=target/test-classes
backend.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
backend.sonar.junit.reportPaths=target/surefire-reports

# NLP Service module (Python)
nlp-service.sonar.projectName=NLP Service
nlp-service.sonar.projectBaseDir=nlp-service
nlp-service.sonar.sources=.
nlp-service.sonar.tests=.
nlp-service.sonar.inclusions=**/*.py
nlp-service.sonar.exclusions=**/test_*.py,**/*_test.py,**/tests/**
nlp-service.sonar.test.inclusions=**/test_*.py,**/*_test.py
nlp-service.sonar.python.coverage.reportPaths=coverage.xml
nlp-service.sonar.python.xunit.reportPath=test-results.xml

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.min.js,**/vendor/**
