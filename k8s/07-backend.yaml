apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-backend
  namespace: ai-resume
  labels:
    app: app-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-backend
  template:
    metadata:
      labels:
        app: app-backend
    spec:
      containers:
        - name: app-backend
          image: anwartamasna/ai-resume-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: ai-resume-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: ai-resume-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-resume-secrets
                  key: POSTGRES_PASSWORD
            - name: MINIO_URL
              valueFrom:
                configMapKeyRef:
                  name: ai-resume-config
                  key: MINIO_URL
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-resume-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-resume-secrets
                  key: MINIO_SECRET_KEY
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: ai-resume-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-resume-secrets
                  key: JWT_SECRET
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-resume-secrets
                  key: ADMIN_PASSWORD
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx384m -Xms128m"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app-backend
  namespace: ai-resume
  labels:
    app: app-backend
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: app-backend
